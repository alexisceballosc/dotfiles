# Core
set-option -g default-shell /opt/homebrew/bin/fish
set -g mouse on
set -g history-limit 50000
set -s escape-time 0

# Claude code integration
set -g allow-passthrough on
set -g extended-keys always
set -as terminal-features 'xterm*:extkeys'
set -g cursor-style blinking-block
set -g xterm-keys on

# Keybinds
unbind '"'
unbind %
bind S-Left split-window -hbc '#{pane_current_path}'
bind S-Right split-window -hc '#{pane_current_path}'
bind S-Up split-window -vbc '#{pane_current_path}'
bind S-Down split-window -vc '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind r source-file ~/.config/tmux/tmux.conf
bind-key g display-popup -w 80% -h 80% -x C -y C -d '#{pane_current_path}' -E '/opt/homebrew/bin/lazygit'
bind-key d display-popup -w 80% -h 80% -x C -y C -d '#{pane_current_path}' -E "fish --login -c 'colima status >/dev/null 2>&1; and exec /opt/homebrew/bin/lazydocker; or begin; echo Colima is not running.; read; end'"
bind-key f display-popup -w 80% -h 80% -x C -y C -d '#{pane_current_path}' -E '/opt/homebrew/bin/yazi'
bind-key e display-popup -w 60% -h 40% -x C -y C -d '#{pane_current_path}' -E 'fish --login'
bind-key E new-pane -x 30% -y 25% -X '#{e|-:#{window_width},#{e|+:#{e|/:#{e|*:#{window_width},30},100},1}}' -Y 1 -S fg=red -R fg=red -c '#{pane_current_path}'
bind-key m display-popup -w 80% -h 80% -x C -y C -E '/opt/homebrew/bin/glances'
bind-key s display-popup -E -w 100% -h 100% "TERM=xterm-256color $HOME/.local/bin/neo --charset=ascii --chars=0xFF66,0xFF9D -C $HOME/.config/neo/colors"
source-file ~/.config/tmux/menu.conf


# Pane borders
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[align=centre]#[fg=red]─▼─,}'

# Status bar
set -g status-position top
set -g status-left '#S '
set -g status-right '#[fg=red]#(whoami) #[fg=brightblack]?#[default]'

# Colors
setw -g clock-mode-colour              'brightblack' # prefix + t
set -g display-panes-colour            'brightblack' # inactive pane indicator
set -g display-panes-active-colour     'white'       # active pane indicator

set -g status-style                    'fg=red bg=default'
set -g status-left-style               'fg=brightblack bg=default'
set -g status-right-style              'fg=brightblack bg=default'

setw -g window-status-style            'fg=red bg=default'
setw -g window-status-current-style    'fg=black bg=red'
setw -g window-status-bell-style       'fg=white bg=default'

setw -g mode-style                     'fg=black bg=red' # copy mode
set -g message-style                   'fg=red bg=default'

set -g pane-border-style               'fg=black bg=default'
set -g pane-active-border-style        'fg=black bg=default'

set -g menu-style                      'fg=white bg=default'
set -g menu-border-style               'fg=brightblack bg=default'
set -g menu-selected-style             'fg=black bg=red'

set -g popup-style                     'fg=default bg=default'
set -g popup-border-style              'fg=brightblack bg=default'
