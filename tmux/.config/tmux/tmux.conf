# Core
set-option -g default-shell /opt/homebrew/bin/fish
set -g mouse on
set -g history-limit 50000
set -s escape-time 0

# Claude code integration
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

run-shell 'seed() { v=$(/opt/homebrew/bin/tmux show-environment -g "$1" 2>/dev/null | sed -n "s/^$1=//p"); [ -n "$v" ] || { v=$(/opt/homebrew/bin/op read "$2") && [ -n "$v" ] && /opt/homebrew/bin/tmux set-environment -g "$1" "$v"; }; }; seed _GH_TOKEN op://Personal/GitHub/token; seed AWS_ACCESS_KEY_ID "op://Work/Aws Console/access-key-id"; seed AWS_SECRET_ACCESS_KEY "op://Work/Aws Console/access-key-secret"'

# Keybinds
bind - split-window -vc '#{pane_current_path}'
bind | split-window -hc '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind r source-file ~/.config/tmux/tmux.conf
bind-key l display-popup -w 80% -h 80% -x C -y C -d '#{pane_current_path}' -E 'GH_TOKEN="$(/opt/homebrew/bin/tmux show-environment -g _GH_TOKEN | cut -d= -f2-)" GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=credential.https://github.com.helper GIT_CONFIG_VALUE_0= GIT_CONFIG_KEY_1=credential.https://github.com.helper GIT_CONFIG_VALUE_1="!/opt/homebrew/bin/gh auth git-credential" /opt/homebrew/bin/lazygit'
bind-key D display-popup -w 80% -h 80% -x C -y C -d '#{pane_current_path}' -E '/opt/homebrew/bin/lazydocker'
bind-key f display-popup -w 80% -h 80% -x C -y C -d '#{pane_current_path}' -E '/opt/homebrew/bin/yazi'
bind-key e display-popup -w 60% -h 40% -x C -y C -d '#{pane_current_path}' -E 'fish --login'
bind-key g display-popup -w 80% -h 80% -x C -y C -E '/opt/homebrew/bin/glances'
bind-key s display-popup -E -w 100% -h 100% '/opt/homebrew/bin/lavat -c red -R1 -F @@::::: -r2'

# Pane borders
set -g pane-border-status top
set -g pane-border-format ''

# Status bar
set -g status-position top
set -g status-left '#S '
set -g status-right '#[fg=red]#(whoami) #[fg=brightblack]↑l #(test -S ~/.colima/default/docker.sock && echo "#[fg=red]↑D#[fg=brightblack]" || echo "↑D") ↑f ↑g ↑e →z →gh#[default]'

# Colors
setw -g clock-mode-colour              'brightblack' # prefix + t
set -g display-panes-colour            'brightblack' # inactive pane indicator
set -g display-panes-active-colour     'white'       # active pane indicator

set -g status-style                    'fg=red bg=default'
set -g status-left-style               'fg=brightblack bg=default'
set -g status-right-style              'fg=brightblack bg=default'

setw -g window-status-style            'fg=red bg=default'
setw -g window-status-current-style    'fg=black bg=red'
setw -g window-status-bell-style       'fg=white bg=default'

setw -g mode-style                     'fg=black bg=red' # copy mode
set -g message-style                   'fg=red bg=default'

set -g pane-border-style               'fg=black bg=default'
set -g pane-active-border-style        'fg=black bg=default'

set -g menu-style                      'fg=white bg=default'
set -g menu-border-style               'fg=brightblack bg=default'
set -g menu-selected-style             'fg=black bg=red'
