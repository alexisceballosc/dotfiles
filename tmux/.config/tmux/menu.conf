bind-key ? display-menu -T '#[align=centre] menu ' -x C -y C \
    "Git #[fg=brightblack](lazygit)" g "display-popup -w 80% -h 80% -x C -y C -d '#{pane_current_path}' -E 'GH_TOKEN=\"$(/opt/homebrew/bin/tmux show-environment -g _GH_TOKEN | cut -d= -f2-)\" GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=credential.https://github.com.helper GIT_CONFIG_VALUE_0= GIT_CONFIG_KEY_1=credential.https://github.com.helper GIT_CONFIG_VALUE_1=\"!/opt/homebrew/bin/gh auth git-credential\" /opt/homebrew/bin/lazygit'" \
    "Docker #[fg=brightblack](lazydocker)" d "display-popup -w 80% -h 80% -x C -y C -d '#{pane_current_path}' -E \"fish --login -c 'test -S ~/.colima/default/docker.sock; and exec /opt/homebrew/bin/lazydocker; or begin; echo Colima is not running.; read; end'\"" \
    "File Manager #[fg=brightblack](yazi)" f "display-popup -w 80% -h 80% -x C -y C -d '#{pane_current_path}' -E '/opt/homebrew/bin/yazi'" \
    "Shell #[fg=brightblack](fish)" e "display-popup -w 60% -h 40% -x C -y C -d '#{pane_current_path}' -E 'fish --login'" \
    "System Monitor #[fg=brightblack](glances)" m "display-popup -w 80% -h 80% -x C -y C -E '/opt/homebrew/bin/glances'" \
    "Screensaver #[fg=brightblack](cmatrix)" s "display-popup -E -w 100% -h 100% '/opt/homebrew/bin/cmatrix'" \
    "" \
    "Colima #(test -S ~/.colima/default/docker.sock && echo '#[fg=green](running)' || echo '#[fg=red](stopped)')" c "display-popup -w 60% -h 20% -x C -y C -E 'fish --login -c \"test -S ~/.colima/default/docker.sock && colima stop || colima start\"'" \
    "" \
    "-z -> zoxide, fast dir jumps" "" "" \
    "-gh -> github repo management" "" "" \
    "-eza -> better ls, use it" "" "" \
    "-rg -> ripgrep, better grep" "" "" \
    "-glow -> markdown viewer, use it" "" ""
