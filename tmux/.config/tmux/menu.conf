bind-key ? run-shell "/opt/homebrew/bin/tmux set -g @colima \"\$(pgrep -qf 'limactl hostagen[t].*colima' && echo '#[fg=green](running)' || echo '(stopped)')\"" \; display-menu -T '#[align=centre] menu ' -x C -y C \
    "Git #[fg=brightblack](lazygit)" g "display-popup -w 80% -h 80% -x C -y C -d '#{pane_current_path}' -E '/opt/homebrew/bin/lazygit'" \
    "Docker #[fg=brightblack](lazydocker)" d "display-popup -w 80% -h 80% -x C -y C -d '#{pane_current_path}' -E \"fish --login -c 'colima status >/dev/null 2>&1; and exec /opt/homebrew/bin/lazydocker; or begin; echo Colima is not running.; read; end'\"" \
    "File Manager #[fg=brightblack](yazi)" f "display-popup -w 80% -h 80% -x C -y C -d '#{pane_current_path}' -E '/opt/homebrew/bin/yazi'" \
    "System Monitor #[fg=brightblack](glances)" m "display-popup -w 80% -h 80% -x C -y C -E '/opt/homebrew/bin/glances'" \
    "Screensaver #[fg=brightblack](neo)" s "display-popup -E -w 100% -h 100% 'TERM=xterm-256color $HOME/.local/bin/neo --charset=ascii --chars=0xFF66,0xFF9D -C $HOME/.config/neo/colors'" \
    "Shell #[fg=brightblack](fish)" e "display-popup -w 60% -h 40% -x C -y C -d '#{pane_current_path}' -E 'fish --login'" \
    "Corner Shell #[fg=brightblack](fish)" E "new-pane -x 30% -y 25% -X '#{e|-:#{window_width},#{e|+:#{e|/:#{e|*:#{window_width},30},100},1}}' -Y 1 -S fg=red -R fg=red -c '#{pane_current_path}'" \
    "" \
    "Colima #{@colima}" c "display-popup -w 60% -h 20% -x C -y C -E 'fish --login -c \"colima status >/dev/null 2>&1 && colima stop || colima start\"'" \
    "" \
    "-z -> zoxide, fast dir jumps" "" "" \
    "-gh -> github repo management" "" "" \
    "-eza -> better ls, use it" "" "" \
    "-rg -> ripgrep, better grep" "" "" \
    "-glow -> markdown viewer, use it" "" "" \
    "-clear --hard -> wipe scrollback too" "" ""
