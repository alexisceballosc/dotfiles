"$schema" = 'https://starship.rs/config-schema.json'

format = "$directory$git_branch$character"
add_newline = false

[directory]
style = 'red'

[git_branch]
style = 'bg:red fg:black'
format = '> [ $symbol$branch(:$remote_branch) ]($style) '

[character]
success_symbol = "[>]()"
error_symbol = "[!]()"
